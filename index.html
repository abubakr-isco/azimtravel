<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azim Travel CRM</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a75'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3EAT%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // тема применяется до отрисовки, чтобы не мигало
    try {
      var t = localStorage.getItem("azim-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AT</div>
        <div>
          <div class="brand-name">Azim Travel</div>
          <div class="brand-sub">CRM · транспорт и туры</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="sync" id="sync" role="status" aria-live="polite"></div>
        <div class="user">
          <div class="avatar">МН</div>
          <div>
            <div style="font-weight:600;font-size:13px">Менеджер</div>
            <div class="small muted">Офис Самарканд</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" data-action="toggle-nav" aria-label="Меню"></button>
        <h1 id="page-title">Обзор</h1>
        <div class="spacer"></div>
        <div style="position:relative">
          <label class="search">
            <span id="search-icon"></span>
            <input id="global-search" type="search" placeholder="Поиск: группа, заказчик, гид…" autocomplete="off">
          </label>
          <div class="search-results hidden" id="search-results"></div>
        </div>
        <button class="btn primary new-btn" data-action="new-request"></button>
        <button class="btn icon ghost" data-action="toggle-theme" id="theme-btn" aria-label="Сменить тему"></button>
      </header>
      <main class="content" id="view"><noscript>Для работы CRM включите JavaScript в браузере.</noscript></main>
    </div>
  </div>

  <div id="layer"></div>
  <div class="toast-wrap" id="toasts"></div>
  <div id="print-area"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
